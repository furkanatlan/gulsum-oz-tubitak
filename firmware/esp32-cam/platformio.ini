; ESP32-CAM (AI Thinker) - marul fotoğraflarını çekip sunucuya gönderir
; VS Code + PlatformIO eklentisi ile açın:  File > Open Folder > firmware/esp32-cam

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
