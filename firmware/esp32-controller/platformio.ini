; Ana kontrol kartı (ESP32 DevKit) - sensörler, röle, pompa, yapay zekâ modeli
; VS Code + PlatformIO eklentisi ile açın:  File > Open Folder > firmware/esp32-controller

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
